<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Планета блобов</title>
  <script type="module" crossorigin src="./assets/planet-Ca4Kp0I_.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/space-792A7NK1.js">
  <link rel="modulepreload" crossorigin href="./assets/audio-Mhu3ie9Z.js">
  <link rel="stylesheet" crossorigin href="./assets/space-DsJQTpQO.css">
  <link rel="stylesheet" crossorigin href="./assets/planet-ozJyU7uI.css">
</head>
<body>
  <div id="app"></div>

  <a id="menu-link" href="./index.html">← Меню</a>
  <button id="btn-mute" title="Звук">🔊</button>

  <div id="page-title">🪐 Планета блобов</div>

  <!-- HUD сытости: компактная карточка слева сверху (под ссылкой «Меню»). -->
  <div id="hud-satiety">
    <span class="hud-label">🫐 Сытость</span>
    <span class="sat-track"><span id="sat-fill"></span></span>
  </div>

  <!-- HUD энергии: вторая пилюля под сытостью (голубо-фиолетовая полоска). -->
  <div id="hud-energy">
    <span class="hud-label">⚡ Энергия</span>
    <span class="sat-track"><span id="energy-fill"></span></span>
  </div>

  <!-- HUD активного блоба: третья пилюля, клик — следующий блоб по кругу. -->
  <div id="hud-temper" title="Следующий блоб">
    <span class="hud-label" id="temper-label">🙂 Обычный</span>
  </div>

  <!-- Кнопки-действия: уложить всех спать (тумблер) и общий танец. -->
  <div id="hud-actions">
    <button id="btn-sleep" title="Сон">😴</button>
    <button id="btn-dance" title="Танец">💃</button>
  </div>

  <div id="hint">крути планету · тискай блоба · тап по земле — ягодка</div>

</body>
</html>

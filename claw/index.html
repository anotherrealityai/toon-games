<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09051d" />
    <meta name="description" content="Неоновая мини-игра с клешнёй и желейными блобами" />
    <title>Лови блоба!</title>
    <script type="module" crossorigin src="./assets/index-DCNmc8DH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BEWuvNn4.css">
  </head>
  <body>
    <main id="app">
      <section class="game-shell" aria-label="Игра «Лови блоба»">
        <div class="topbar">
          <div class="brand">
            <span class="brand-star" aria-hidden="true">✦</span>
            <span><b>ЛОВИ</b> БЛОБА</span>
          </div>
          <div class="status-pill" id="status" role="status" aria-live="polite">Двигай клешню к блобу</div>
          <button class="icon-button" id="sound" type="button" aria-label="Выключить звук" title="Звук включён">♫</button>
        </div>

        <div class="stage" id="stage">
          <canvas id="game" aria-label="Неоновый автомат с клешнёй"></canvas>
          <div class="loading" id="loading"><span></span>Зажигаем неон…</div>
          <div class="reticle" id="reticle" aria-hidden="true"><i></i></div>
          <div class="toast" id="toast" role="status" aria-live="assertive"></div>
          <div class="help">Стрелки / WASD — двигать клешню · Пробел — опустить</div>
        </div>

        <div class="bottom-panel">
          <div class="collection" aria-label="Коллекция блобов">
            <div class="collection-label"><span>ПОЙМАНО</span><b id="score">0 / 15</b></div>
            <div class="collection-slots" id="collection"></div>
          </div>

          <div class="controls" aria-label="Управление клешнёй">
            <div class="dpad" aria-label="Направление">
              <button type="button" data-move="up" aria-label="Двигать назад">▲</button>
              <button type="button" data-move="left" aria-label="Двигать влево">◀</button>
              <span aria-hidden="true">✦</span>
              <button type="button" data-move="right" aria-label="Двигать вправо">▶</button>
              <button type="button" data-move="down" aria-label="Двигать вперёд">▼</button>
            </div>
            <button class="grab-button" id="grab" type="button" disabled><span>ОПУСТИТЬ</span><small>ПРОБЕЛ</small></button>
            <button class="reset-button" id="reset" type="button" aria-label="Начать заново" title="Начать заново">↻<span>Сброс</span></button>
          </div>
        </div>

        <div class="finish" id="finish" role="dialog" aria-modal="true" aria-labelledby="finish-title" hidden>
          <div class="finish-card">
            <div class="finish-burst" aria-hidden="true">✦</div>
            <p>КОЛЛЕКЦИЯ СОБРАНА</p>
            <h1 id="finish-title">Все блобы твои!</h1>
            <button id="replay" type="button">Сыграть ещё</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
